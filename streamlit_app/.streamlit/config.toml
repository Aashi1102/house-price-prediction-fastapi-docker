[theme]
base = "light"
primaryColor = "#1D4ED8"              # Royal blue for sliders, focus borders, and accents
backgroundColor = "#FFFFFF"           # Clean white main background
secondaryBackgroundColor = "#EFF6FF"  # Soft ice-blue for dropdowns, inputs, and sidebar
textColor = "#0F172A"                 # Deep navy-slate for crisp readability
font = "sans serif"